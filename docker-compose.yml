services:
  skapersok_backend:
    build: .
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ping')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
