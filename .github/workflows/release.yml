name: Build and release

on:
    push:
        tags:
            - "v*"

jobs:
    release:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Check version
              shell: pwsh
              run: |
                $pyprojectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
                $tagVersion = "${env:GITHUB_REF_NAME}".TrimStart("v")

                Write-Host "pyproject.toml: $pyprojectVersion"
                Write-Host "Git tag:         $tagVersion"

                if ($pyprojectVersion -ne $tagVersion) {
                    Write-Error "Version mismatch!"
                    exit 1
                }

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install .
                pip install pyinstaller

            - name: Build with PyInstaller
              run: pyinstaller skapersok_backend.spec

            - name: Build windows installer
              shell: pwsh
              run: |
                $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
                iscc /DMyAppVersion=$version installer.iss

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                files: |
                    installer/SkapersokBackendSetup.exe
                generate_release_notes: true
